<!DOCTYPE html>
<!--
 Notas · Lab. de Informática
 VERSÃO 1.10.0 · build 24/11/2026 (horário de Brasília)
 Histórico (mais recente primeiro):
 1.10.0 (24/11/2026)
   - Média bimestral e média final arredondadas sempre para cima, de 0,5 em 0,5 (6,8 → 7,0; 8,3 → 8,5). P1, P2, ENG/TRAB e atividades continuam com notas quebradas.
   - Na ficha do aluno, tocar em uma linha de "Notas por bimestre" abre aquele bimestre na turma do aluno e destaca a linha dele na tabela de notas.
 1.9.0 (23/11/2026)
   - REC bimestral: o campo e o botão NF passam a aparecer só para alunos com média abaixo de 6 (e que ainda estão na turma). Quem já tem 6 ou mais não pode fazer REC.
   - A nota da REC agora substitui a média do bimestre, com aviso "REC" na nota final (antes era uma média entre nota e REC). Regra anterior substituída.
   - Alunos com nota igual ou superior a 6, ou que já saíram da turma, não recebem campo de REC; se houver REC registrada, aparece apenas como leitura.
 1.8.3 (23/11/2026)
   - Conselho: todas as listas passam a seguir a ordem por turma e, dentro da turma, a ordem da listagem (nº da chamada), inclusive a Pauta do Conselho.
 1.8.2 (23/11/2026)
   - Na área de Conselho, a tabela de média anual passa a abrir sempre na 1A (menor turma). A pauta do conselho continua mostrando todas as turmas; para ver todas as situações na tabela, é só escolher "Todas as turmas".
 1.8.1 (23/11/2026)
   - Conselho: identidade visual própria (roxo), sem turma padrão e com "Pauta do Conselho" no topo: alunos com média abaixo de 6 (soma dos 4 bimestres menor que 24) para receber pontos na reunião e evitar REC final.
 1.8.0 (23/11/2026)
   - Nova área 🎓 Conselho / Fechamento: acompanhamento durante o ano e fechamento anual, com média por bimestre, média anual, situação, lista de REC final, quanto falta para 6, ajuste necessário no 4º bimestre, ponto fraco por bimestre, lista de resgate, PDF e Excel.
 1.7.1 (23/11/2026)
   - Corrigido: o aviso de nova versão aparecia sempre (lia o texto errado); agora compara os números da versão.
   - Chamada/Frequência removida por enquanto (não será usada agora).
   - REC (0 a 10): média final = (média + REC) ÷ 2, com indicação explícita "REC" na média e a conta na ficha do aluno (regra trocada na v1.9.0: a REC passa a substituir a média).
   - Aluno que precisava e não fez a REC (botão NF): mantém a média anterior, com aviso "sem REC", e aparece na seção "Não fez a REC" do relatório de Atenção.
 1.7.0 (19/11/2026)
   - Recuperação (REC): coluna Nota + REC (botão 👁 REC), média final depois da recuperação, contorno azul na média e regra configurável em Backup. Listas de recuperação usam a nota antes da REC.
   - Busca de aluno pelo nome, na parte de cima, abre a ficha.
   - Aviso de nova versão: o app avisa quando há versão nova e atualiza com um toque.
   - Exportar o bimestre em planilha Excel (.xlsx), uma aba por turma + resumo (Relatórios e Backup).
   - Frequência: chamada por turma e data (botão 📝 Chamada), pendência automática da chamada do dia, relatório Frequência (presença por turma e faltosos com média baixa) e faltas na ficha.
 1.6.0 (18/11/2026)
   - Ficha do aluno: número da chamada e explicação de como a média é calculada (com a conta do próprio aluno).
   - Campo da P1 só com a identificação "P1"; os cabeçalhos mostram as faixas (P1 0–8, P2 0–8, ENG/TRAB 0–2). ENG no Fundamental I e TRAB no Fundamental II, em toda a tela, relatórios e cópia para planilha.
   - Alunos em amarelo (saíram ou mudaram de turma): sem destaques de P3 (campo, borda e contorno da média).
   - Relatório de Atenção: recuperação bimestral separada em Fundamental I e Fundamental II.
 1.5.0 (17/11/2026)
   - Efeito zebra mais marcado no computador (no celular continua igual).
   - Ao passar o mouse, a linha fica destacada e as outras esmaecem.
   - Rodapé com número da versão e data/hora da build; toque nele para ver o histórico.
   - Agenda: cada aula aparece separada, com intervalos e janelas (ex.: terça: 8A 07:00–07:50 e 07:50–08:40, intervalo 09:30–09:50).
 1.4.0 (16/11/2026)
   - Colunas Nº e Nome congeladas ao rolar para o lado; linhas zebradas.
   - Importação dos bimestres 1, 2 e 3 (Backup > Mesclar bimestres).
   - P3 feita sem efeito na média fica amarela; "P3 pendente" saiu das pendências.
   - Relatório de Atenção por turma e ordem alfabética; lista da recuperação para as professoras (texto e PDF).
   - Alunos que não fizeram nada recebem zero.
 1.3.0 (nov/2026)
   - Tela inicial com aulas do dia, pendências, tarefas, resumo e horários.
   - Ficha do aluno com gráfico de evolução.
   - Histórico de alterações com desfazer.
   - Aba Estatísticas e app instalável (PWA).
 1.2.0 (nov/2026)
   - Relatórios: visão geral, comparativo, atenção e turma, com PDF.
   - Painel das turmas e controle de lançamento na escola (P1, P2, Eng/T).
   - Aviso de nota alterada depois de lançada.
 1.1.0 (nov/2026)
   - Modo de edição travado, sincronização automática, agenda de aulas, cores pastel por bimestre.
   - Coluna P3 escondida com contorno amarelo na média.
 1.0.0 (nov/2026)
   - Primeira versão: notas por turma e bimestre, regras do Fundamental I e II, nuvem (Supabase), tema escuro.
-->

<style>

[data-bim="1"]{--bc:var(--b1)}[data-bim="2"]{--bc:var(--b2)}[data-bim="3"]{--bc:var(--b3)}[data-bim="4"]{--bc:var(--b4)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-area="c"]{--bc:#9775fa;--bct:#14161c;--pri:#845ef7;--media:#b197fc;--mediabg:#2b2145}}

.bb.on{background:var(--c);color:var(--bct)}
.chip.on{background:var(--bc);border-color:var(--bc);color:var(--bct)}

@media print{#pr td.recm{box-shadow:inset 0 0 0 2px #4c9be8}}
.srch{position:relative;margin-bottom:8px}.srch input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
#bres{position:absolute;left:0;right:0;top:100%;z-index:15;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:320px;overflow:auto;display:none}
#bres div{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}#bres div:hover{background:var(--bg)}

.rcb{display:block;font-size:9px;font-weight:700;color:#2b6cb0;line-height:1.1}.rcb.nf{color:var(--bad)}
:root[data-theme="dark"] .rcb{color:#8ec5ff}
.nfb{margin-left:3px;font-size:10px;padding:2px 4px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);cursor:pointer}.nfb.on{background:var(--badbg);color:var(--badtx);border-color:var(--bad)}
td.rnf{background:var(--badbg)!important}td.rnf .in{background:transparent}td.rnf .in::placeholder{color:var(--badtx);font-weight:700}
.locked .nfb{pointer-events:none;opacity:.6}

/* Conselho / Fechamento */
.cn-hint{font-size:12px;color:var(--mut);margin:0 0 8px;line-height:1.5}
.cn-tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin:1px 3px 1px 0;background:var(--bg);color:var(--mut);white-space:nowrap}
.cn-tag.r{background:var(--badbg);color:var(--badtx);font-weight:700}
.cn-tag.y{background:var(--half);color:var(--tx)}
.cn-tag.g{background:var(--okbg);color:var(--ok)}
.cn-hist{margin-top:14px}
.cn-hist summary{cursor:pointer;font-weight:600;color:var(--mut);padding:6px 0}
.cn-hist .scroll{margin-top:6px}
.cn-prio{background:var(--mediabg);border:1px solid var(--bc);border-radius:10px;padding:8px 10px;margin:10px 0}
.cn-prio h3{margin:0 0 4px;font-size:15px;color:var(--media)}
.cn-prio .scroll{background:var(--card);border-radius:8px}
.cn-area{display:inline-block;font-size:10px;letter-spacing:.08em;background:var(--mediabg);color:var(--media);border:1px solid var(--bc);border-radius:99px;padding:2px 8px;margin-right:8px;vertical-align:middle;font-weight:700}
.rvw td small{display:block;font-size:10px;font-weight:400;color:var(--mut)}
tr.hl>td{background:var(--half)!important;box-shadow:inset 0 0 0 2px var(--pri)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>📚 Notas · Lab. de Informática</h1>
<div class="bims" id="bims"><button class="bb" data-b="1">1º Bim</button><button class="bb" data-b="2">2º Bim</button><button class="bb" data-b="3">3º Bim</button><button class="bb" data-b="4">4º Bim</button></div>
<button class="btn" id="hm" title="Início">🏠 Início</button><button class="btn" id="rt">📊 Relatórios</button><button class="btn" id="cn">🎓 Conselho</button><button class="btn" id="pn">📋 Painel</button><button class="btn" id="th" title="Tema claro/escuro">🌙</button><button class="btn" id="bk">Backup / Exportar</button>
</header>
<div class="srch"><input id="bq" type="search" placeholder="🔍 Buscar aluno pelo nome…" autocomplete="off"><div id="bres"></div></div>
<div class="chipbar"><div class="chips" id="chips"></div><button class="btn" id="cl" style="display:none" title="Sincronizar agora"></button></div>
<div class="card" id="card"></div>
<div class="sched" id="sched"></div>
<div class="ver" id="ver" title="Ver histórico de versões"></div>
</div>
<div class="ov" id="ov"><div class="box">
<b>Backup e exportação</b>
<p>Seus dados ficam salvos neste navegador. Copie o backup de vez em quando e guarde em um lugar seguro (e-mail, bloco de notas).</p>
<div class="row"><button class="btn pri" id="b1">Gerar backup completo</button><button class="btn" id="b2">Notas da turma (colar na planilha)</button><button class="btn" id="bx">⬇ Exportar bimestre (.xlsx)</button></div>
<textarea id="ta" placeholder="O texto aparece aqui. Para restaurar, cole um backup e toque em Restaurar."></textarea>
<div class="row"><button class="btn" id="b3">Copiar texto</button><button class="btn" id="b4">Restaurar backup colado</button><button class="btn" id="b6">Baixar arquivo .json</button><label class="btn">Restaurar de arquivo<input type="file" id="fi" accept=".json" hidden></label><label class="btn">Mesclar bimestres (arquivo)<input type="file" id="fm" accept=".json" hidden></label><button class="btn" id="b5">Fechar</button></div>
<p id="msg"></p>
</div></div>
<div id="nv" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:#1c2333;color:#fff;border-radius:10px;padding:10px 12px;align-items:center;gap:10px;justify-content:space-between"><span id="nvt"></span><button class="btn pri" id="nvb">Atualizar</button></div>
<div class="ov" id="vo"><div class="box"><b>Histórico de versões</b><div id="vl"></div><div class="row"><button class="btn" id="vc">Fechar</button></div></div></div>
<div id="pr"></div>
<div class="ov" id="lg"><div class="box"><b>Entrar</b><p>Acesso restrito ao professor.</p>
<div class="row"><input class="in" style="width:100%;text-align:left" id="em" type="email" placeholder="E-mail" autocomplete="username"></div>
<div class="row"><input class="in" style="width:100%;text-align:left" id="pw" type="password" placeholder="Senha" autocomplete="current-password"></div>
<div class="row"><button class="btn pri" id="go">Entrar</button></div><p id="lm"></p></div></div>
<script>
const DATA={"turmas":["1A","1D","2A","2D","3A","3D","4A","4D","5A","5D","6A","6B","6D","7A","7B","7D","8A","8B","8D","9A","9B","9D"],"roster":{"1A":[],"1D":[],"2A":[],"2D":[],"3A":[],"3D":[],"4A":[],"4D":[],"5A":[],"5D":[],"6A":[],"6B":[],"6D":[],"7A":[],"7B":[],"7D":[],"8A":[],"8B":[],"8D":[],"9A":[],"9B":[],"9D":[]},"grades":{}};
const KEY='notas-lab-info-v1';
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.roster)db=DATA;
const ctPadrao=()=>db.turmas.includes('1A')?'1A':db.turmas[0]; // turma menor, para não abrir uma lista gigante
const S={bim:'4',t:db.turmas[0],edit:false,p3v:false,recv:false,view:'h',cm:'f',ct:ctPadrao()};
const $=id=>document.getElementById(id);
const lg=(b,t,id,f,o,n)=>{o=o==null?null:o;n=n==null?null:n;if(o===n)return;db.log=db.log||[];db.log.push([Date.now(),b,t,id,f,o,n]);if(db.log.length>400)db.log.splice(0,db.log.length-400)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}push()}
const fmt=v=>v==null?'':(Math.round(v*10)/10).toFixed(1).replace('.',',');
// Média bimestral/final: sempre para cima, de 0,5 em 0,5 (6,8 → 7,0; 8,3 → 8,5).
const arredMedia=v=>v==null?null:Math.ceil(v*2-1e-9)/2;
const f1=t=>+t[0]<=5;
const CUR='4',MEDIA_MIN=6,PROVA_MIN=3.5,P3_MAX=4;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const L=(b,t)=>{db.launch=db.launch||{};db.launch[b]=db.launch[b]||{};return db.launch[b][t]=db.launch[b][t]||{}};
const G=(b,t)=>((db.grades[b]=db.grades[b]||{})[t]=db.grades[b][t]||{});
const p3pend=(ros,gr)=>ros.filter(s=>{const g=gr[s.id]||{};return !s.off&&g.p3==null&&(g.p1==null||g.p1<=P3_MAX)}).length;
function calc(t,g){g=g||{};const a=g.a||[];const vs=a.filter(v=>v!=null);const cnt=vs.length,sum=vs.reduce((s,v)=>s+v,0);let p1,p2,e,p3=null;
 if(f1(t)){p1=g.p1==null?null:g.p1;p3=g.p3==null?null:g.p3;p2=sum;e=cnt/2}else{p1=sum;p2=cnt*2;e=g.e==null?null:g.e}
 const any=cnt>0||g.p1!=null||g.e!=null||p3!=null;
 let pu=p1,u3=false;if(p3!=null&&(p1==null||p3>p1)){pu=p3;u3=true}
 const nota=any?arredMedia(((pu||0)+p2)/2+(e||0)):null,rec=g.r==null?null:g.r;let m=nota,ur=false;
 // REC bimestral só existe para quem ficou abaixo de 6: a nota da REC substitui a média do bimestre.
 if(any&&rec!=null&&nota<MEDIA_MIN){m=arredMedia(rec);ur=true}
 return{p1,p2,e,p3,cnt,u3,nota,rec,rn:g.rn?1:0,ur,m,any}}
const recElegivel=(t,s,g)=>{const r=calc(t,g);return !!r.any&&r.nota<MEDIA_MIN&&!s.off};
function num(s){s=String(s).trim().replace(',','.');if(s==='')return null;const v=parseFloat(s);return isNaN(v)?null:Math.min(10,Math.max(0,v))}
function turmaTitle(t){return t[0]+'º ano '+t.slice(1)}
function chips(){$('chips').innerHTML=db.turmas.map(t=>{const l=(((db.launch||{})[S.bim]||{})[t])||{},n=(l.p1?1:0)+(l.p2?1:0)+(l.t?1:0);return `<button class="chip ${t===S.t&&!S.view?'on':''}" data-t="${t}" title="Lançado na escola: ${n}/3">${t}${n==3?' ✓':n?' ◐':''}${Object.keys(l.dirty||{}).length?' ⚠':''}</button>`}).join('');
 $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.t=b.dataset.t;S.edit=false;S.unlock=false;S.cnBack=false;S.view=null;chips();render()})}
const SCH={'2A':['Segunda',['07:00–07:50']],'3A':['Segunda',['11:00–11:50']],'5D':['Segunda',['12:40–13:30']],
'8A':['Terça',['07:00–08:40']],'8B':['Terça',['08:40–09:30','09:50–10:40']],'9B':['Terça',['10:40–12:20']],'2D':['Terça',['12:40–13:30']],'8D':['Terça',['15:10–16:00']],'9D':['Terça',['17:10–18:00']],
'5A':['Quarta',['10:10–11:00']],'1A':['Quarta',['11:00–11:50']],'1D':['Quarta',['12:40–13:30']],
'6B':['Quinta',['07:00–07:50']],'6A':['Quinta',['07:50–08:40']],'4A':['Quinta',['11:00–11:50']],'4D':['Quinta',['12:40–13:30']],
'9A':['Sexta',['07:00–08:40']],'7B':['Sexta',['09:00–09:50']],'7A':['Sexta',['11:30–12:20']],'3D':['Sexta',['12:40–13:30']],'6D':['Sexta',['16:20–17:10']],'7D':['Sexta',['17:10–18:00']]};
const DN={'Segunda':1,'Terça':2,'Quarta':3,'Quinta':4,'Sexta':5};
function sched(){const el=$('sched');if(!el)return;const s=SCH[S.t];if(S.view||!s){el.style.display='none';return}
 const turno=+s[1][0].slice(0,2)<12?'Matutino':'Vespertino',hoje=new Date().getDay()==DN[s[0]];
 el.style.display='';el.innerHTML='<b>Dia e horário da aula · '+turmaTitle(S.t)+'</b><div class="sl"><span>'+s[0]+'-feira · '+s[1].flatMap(split).join(' e ')+'</span><span style="color:var(--mut);font-weight:400;font-size:13px">'+turno+'</span>'+(hoje?'<span class="hj">hoje</span>':'')+'</div>'}
function render(){
 if(S.view=='c')document.documentElement.dataset.area='c';else delete document.documentElement.dataset.area;
 const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=S.view=='c'?'#6741d9':'#8fb4e3';
 sched();
 if(S.view=='h'){home();sched();return}
 if(S.view=='f'){ficha();sched();return}
 if(S.view=='r'){relat();sched();return}
 if(S.view=='c'){conselho();sched();return}
 if(S.view){painel();sched();return}
 const t=S.t,ros=db.roster[t]||[],gr=G(S.bim,t),fund=f1(t);
 const LL=L(S.bim,t);
 let h=`<h2><span>${S.bim}º BIMESTRE / 2026 · ${turmaTitle(t)}</span><span><button class="btn lock ${S.unlock?'open':''}" id="lk">${S.unlock?'✏️ Editando · travar':'🔒 Liberar edição'}</button> <button class="btn" id="rp">🖨 Relatório</button> <button class="btn" id="rcv">${S.recv?'🙈 Ocultar REC':'👁 REC'} (${recPend(t,ros,gr)})</button> ${fund?`<button class="btn" id="p3v">${S.p3v?'🙈 Ocultar P3':'👁 P3'} (${p3pend(ros,gr)})</button> <button class="btn" id="p3b">🖨 Lista P3</button> `:''}${S.unlock?`<button class="btn" id="ed">${S.edit?'Concluir edição':'Editar lista'}</button>`:''}</span></h2><div class="lanc"><b>Lançado no sistema da escola:</b>${[['p1','P1'],['p2','P2'],['t',fund?'ENG':'TRAB']].concat(hasRecT(ros,gr)?[['r','REC']]:[]).map(([k,n])=>`<button class="lb ${LL[k]?'on':''}" data-l="${k}">${LL[k]?'☑':'☐'} ${n}</button>`).join('')}</div><div id="warn"></div>`;
 h+=`<div class="scroll"><table class="stk"><thead><tr><th>Nº</th><th style="text-align:left">Nome</th>`+[0,1,2,3].map(i=>`<th class="fill" data-f="${i}" title="Marcar todos que estão em branco como entregue">Ativ ${i+1}</th>`).join('')+`<th>P1<small>0–8</small></th><th>P2<small>0–8</small></th><th>${fund?'ENG':'TRAB'}<small>0–2</small></th>${fund&&S.p3v?'<th title="Recuperação da P1">P3</th>':''}${S.recv?'<th>Nota</th><th title="Recuperação bimestral">REC<small>0–10</small></th>':''}<th>Média</th></tr></thead><tbody>`;
 if(!ros.length)h+=`<tr><td colspan="13" class="empty">Nenhum aluno nesta turma.</td></tr>`;
 ros.forEach((s,i)=>{const g=gr[s.id]||{};
  h+=`<tr data-id="${s.id}" class="${s.off?'off':''}"><td class="n">${i+1}</td><td class="nm">${S.edit?`<input class="in" style="width:80%;text-align:left" data-rn="${s.id}" value="${s.n.replace(/"/g,'&quot;')}"> <button class="x" data-del="${s.id}" title="Remover aluno">✕</button><br><label style="font-size:12px"><input type="checkbox" data-off="${s.id}" ${s.off?'checked':''}> Saiu da turma</label><br><input class="in" style="width:95%;text-align:left;margin-top:4px" data-obs="${s.id}" placeholder="Observação" value="${esc(s.obs||'')}">`:s.n+(s.off?'<span class="tag">saiu</span>':'')+(s.obs?'<div class="obs">'+esc(s.obs)+'</div>':'')}</td>`;
  for(let k=0;k<4;k++){const v=(g.a||[])[k];h+=`<td><button class="a ${v==2?'v2':v==1?'v1':''}" data-k="${k}">${v==null?'·':fmt(v)}</button></td>`}
  h+=fund?`<td><input class="in p" data-f="p1" inputmode="decimal" value="${fmt(g.p1)}" placeholder="P1"></td><td class="c" data-c="p2"></td><td class="c" data-c="e"></td>${S.p3v?`<td><input class="in p" data-f="p3" inputmode="decimal" value="${fmt(g.p3)}" placeholder="P3"></td>`:''}`
        :`<td class="c" data-c="p1"></td><td class="c" data-c="p2"></td><td><input class="in p" data-f="e" inputmode="decimal" value="${fmt(g.e)}" placeholder="TRAB"></td>`;
  const eleg=recElegivel(t,s,g);
  h+=`${S.recv?`<td class="c" data-c="nota"></td><td class="r-cell" data-rc="${s.id}">${eleg?`<input class="in p" data-f="r" inputmode="decimal" value="${fmt(g.r)}" placeholder="REC"><button class="nfb" data-nf title="O aluno precisava e não fez a REC">NF</button>`:(g.r!=null?`<span class="mi">${fmt(g.r)} <small>REC</small></span>`:(g.rn?'<span class="mi">não fez</span>':'<span class="mi">—</span>'))}</td>`:''}<td class="c m" data-c="m"></td></tr>`});
 h+=`</tbody></table></div><div class="foot" id="foot"></div>`;
 if(S.edit)h+=`<div class="add"><input id="newn" placeholder="Nome do novo aluno"><button class="btn pri" id="addb">Adicionar aluno</button></div>`;
 h+=`<div class="rule">${fund?'Fundamental I: P1 digitada · P2 = soma das atividades · ENG = 0,5 por atividade entregue · Média = (P1 + P2) ÷ 2 + ENG.':'Fundamental II: P1 = soma das atividades · P2 = 2 por atividade entregue · TRAB digitado · Média = (P1 + P2) ÷ 2 + TRAB.'} Toque na atividade: 2 → 1 → em branco. Contorno amarelo na média = a P3 entrou no cálculo. A média do bimestre é arredondada <b>para cima, de 0,5 em 0,5</b> (6,8 → 7,0; 8,3 → 8,5); P1, P2, ENG/TRAB e atividades ficam com as notas quebradas.</div>`;
 $('card').innerHTML=h;$('card').classList.toggle('locked',!S.unlock);
 ros.forEach(s=>upd(s.id));foot();warn();
 const card=$('card');
 card.querySelectorAll('.a').forEach(b=>b.onclick=()=>{const id=b.closest('tr').dataset.id,k=+b.dataset.k,g=(gr[id]=gr[id]||{a:[null,null,null,null]});g.a=g.a||[null,null,null,null];
  const c=g.a[k];g.a[k]=c==null?2:c==2?1:null;lg(S.bim,t,id,'a'+(k+1),c,g.a[k]);b.className='a '+(g.a[k]==2?'v2':g.a[k]==1?'v1':'');b.textContent=g.a[k]==null?'·':fmt(g.a[k]);touch(id,'a');save();upd(id);foot()});
 card.querySelectorAll('th.fill').forEach(th=>th.onclick=()=>{const k=+th.dataset.f;ros.forEach(s=>{const g=(gr[s.id]=gr[s.id]||{a:[null,null,null,null]});g.a=g.a||[null,null,null,null];if(g.a[k]==null){g.a[k]=2;lg(S.bim,t,s.id,'a'+(k+1),null,2);touch(s.id,'a')}});save();render()});
 card.querySelectorAll('input.p').forEach(inp=>{
  inp.oninput=()=>{const id=inp.closest('tr').dataset.id,g=(gr[id]=gr[id]||{});g[inp.dataset.f]=num(inp.value);if(inp.dataset.f=='r'&&g.r!=null)g.rn=0;touch(id,inp.dataset.f);save();upd(id);foot()};
  inp.onblur=()=>{const v=num(inp.value);inp.value=fmt(v)};
  inp.onfocus=()=>{inp.select();inp.dataset.old=inp.value};
  inp.onchange=()=>{lg(S.bim,t,inp.closest('tr').dataset.id,inp.dataset.f,num(inp.dataset.old),num(inp.value));inp.dataset.old=inp.value};
  inp.onkeydown=e=>{const all=[...card.querySelectorAll('input.p[data-f="'+inp.dataset.f+'"]')],i=all.indexOf(inp);
   if(e.key=='Enter'||e.key=='ArrowDown'){e.preventDefault();(all[i+1]||inp).focus()}
   if(e.key=='ArrowUp'){e.preventDefault();(all[i-1]||inp).focus()}}});
 card.querySelectorAll('[data-off]').forEach(c=>c.onchange=()=>{const s=ros.find(x=>x.id==c.dataset.off);if(s){s.off=c.checked?1:0;save();c.closest('tr').classList.toggle('off',c.checked);foot()}});
 card.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const l=L(S.bim,t),k=b.dataset.l;const o=l[k]?1:0;l[k]=1-o;lg(S.bim,t,'','L'+k,o,1-o);if(l.dirty)Object.keys(l.dirty).forEach(i=>{l.dirty[i]=l.dirty[i].filter(c=>c!=k);if(!l.dirty[i].length)delete l.dirty[i]});save();chips();render()});
 card.querySelectorAll('[data-obs]').forEach(i=>i.onchange=()=>{const s=ros.find(x=>x.id==i.dataset.obs);if(s){s.obs=i.value.trim();save()}});
 $('rp').onclick=()=>report(0);const pb=$('p3b');if(pb)pb.onclick=()=>report(1);
 card.querySelectorAll('td.nm').forEach(td=>td.onclick=e=>{if(S.edit||e.target.closest('input,button,label'))return;S.fi={t,id:td.closest('tr').dataset.id};S.view='f';render()});
 const ed=$('ed');if(ed)ed.onclick=()=>{S.edit=!S.edit;render()};
 card.querySelectorAll('[data-nf]').forEach(b=>b.onclick=()=>{const id=b.closest('tr').dataset.id,g=(gr[id]=gr[id]||{}),o=g.rn?1:0;g.rn=1-o;if(g.rn)g.r=null;lg(S.bim,t,id,'rn',o,g.rn);touch(id,'rn');save();const ip=b.parentNode.querySelector('input');if(ip&&g.rn)ip.value='';upd(id);foot()});
 const rv_=$('rcv');if(rv_)rv_.onclick=()=>{S.recv=!S.recv;render()};
 const pv=$('p3v');if(pv)pv.onclick=()=>{S.p3v=!S.p3v;render()};
 $('lk').onclick=async()=>{if(S.unlock){S.unlock=false;S.edit=false;render();poll();return}await poll(true);S.unlock=true;render()};
 card.querySelectorAll('[data-rn]').forEach(i=>i.onchange=()=>{const s=ros.find(x=>x.id==i.dataset.rn);if(s&&i.value.trim()){s.n=i.value.trim();save()}});

function undo(i){const e=(db.log||[])[i];if(!e)return 'Registro não encontrado.';const[,b,t,id,f,o,n]=e;
 if(f[0]=='L'){const l=L(b,t),k=f.slice(1);if((l[k]?1:0)!==n)return 'O valor já mudou depois dessa alteração.';l[k]=o}
 else{const gb=G(b,t),g=(gb[id]=gb[id]||{}),cur=f[0]=='a'?(g.a||[])[+f[1]-1]:g[f];if((cur==null?null:cur)!==n)return 'O valor já mudou depois dessa alteração.';

 lg(b,t,id,f,n,o);save();return ''}

// ---- Conselho / Fechamento -------------------------------------------------
const BIMS=['1','2','3','4'];
const ordemConselho=(a,b)=>cmpN(a.t,b.t)||(a.i-b.i); // turma e, dentro dela, a ordem da listagem (nº da chamada)
const faixaConselho=()=>{const v=+((db.cf||{}).conselho);return isFinite(v)&&v>=0&&v<MEDIA_MIN?v:0.5};
function pontoFraco(t,b,g,r){
 const a=g.a||[],cnt=a.filter(v=>v!=null).length;
 const p=f1(t)?[['P1',r.p1,8],['Ativ./P2',r.p2,8],['ENG',r.e,2]]:[['Ativ./P1',r.p1,8],['Presença/P2',r.p2,8],['TRAB',r.e,2]];
 p.push(['Ativ. entregues',cnt,4]);
 const v=p.filter(x=>x[1]!=null).map(x=>[x[0],x[1]/x[2],x[1],x[2]]).sort((x,y)=>x[1]-y[1]);
 return v.length?{txt:`${b}º: ${v[0][0]} ${fmt(v[0][2])}/${fmt(v[0][3])}`,ratio:v[0][1]}:null}
function conselhoRows(ate){
 const fx=faixaConselho(),out=[];
 db.turmas.forEach(t=>(db.roster[t]||[]).forEach((s,i)=>{
  const detalhe=BIMS.map(b=>{const g=((db.grades[b]||{})[t]||{})[s.id]||{};return{g,r:calc(t,g)}});
  const bms=detalhe.map(d=>d.r.any?d.r.m:null);
  const usados=bms.slice(0,ate).filter(v=>v!=null),n=usados.length,soma=usados.reduce((a,v)=>a+v,0);
  const media=n?arredMedia(soma/n):null,falta=media==null?null:Math.max(0,MEDIA_MIN-media),restantes=4-n;
  const need=(n&&restantes)?(MEDIA_MIN*4-soma)/restantes:null,critico=need!=null&&need>10;
  const alvo4=bms[3]==null?need:(media==null?null:bms[3]+(MEDIA_MIN-media)*4),atinge4=alvo4==null?null:alvo4<=10;
  const sit=media==null?'Sem nota':(media>=MEDIA_MIN?'Aprovado':(falta<=fx?'Conselho':'REC final'));
  let queda=null,quedaBim=null;for(let k=1;k<ate;k++){if(bms[k]==null||bms[k-1]==null)continue;const d=bms[k]-bms[k-1];if(queda==null||d<queda){queda=d;quedaBim=k+1}}
  let fraco=null;detalhe.slice(0,ate).forEach((d,k)=>{const p=d.r.any&&pontoFraco(t,BIMS[k],d.g,d.r);if(p&&(!fraco||p.ratio<fraco.ratio))fraco=p});
  const risco=media!=null&&(media<MEDIA_MIN||(queda!=null&&queda<=-1)||critico);
  out.push({t,s,i:i+1,off:!!s.off,bms,soma,media,n,falta,need,critico,alvo4,atinge4,sit,queda,quedaBim,fraco:fraco?fraco.txt:'',risco,obs:s.obs||''});
 }));
 return out}
function conselhoCorpo(rows,ate,fx,modo){
 const at=rows.filter(r=>!r.off),off=rows.filter(r=>r.off),medias=at.map(r=>r.media).filter(v=>v!=null);
 const cnt=s=>at.filter(r=>r.sit==s).length,nrec=cnt('REC final'),ncon=cnt('Conselho'),nap=cnt('Aprovado'),nsem=cnt('Sem nota');
 const risco=at.filter(r=>r.risco).length,criticos=at.filter(r=>r.critico).length,quedas=at.filter(r=>r.queda!=null&&r.queda<=-1).length;
 const alvo=modo=='f'?'Média anual · 2026':`Acumulado até o ${ate}º bimestre`,adj=modo=='f'?'Ajuste no 4º':'Nos que faltam';
 let h=`<p class="cn-hint">Média simples dos bimestres com nota (até o ${ate}º; cada linha mostra quantos bimestres entraram: <b>n/4</b>). A média final também é arredondada para cima, de 0,5 em 0,5. Nota de corte <b>${MEDIA_MIN}</b>. <b>Conselho</b> = falta de até ${fmt(fx)} para ${MEDIA_MIN}; abaixo disso, <b>REC final</b>. Quem saiu da turma fica só no histórico.</p>`;
 const parcial=at.some(r=>r.n<4)?' (parcial)':'';
 h+=kp(modo=='f'?[[at.length,'alunos na sala'],[FM(avgOf(medias)),'média anual'+parcial],[nap,'aprovados'],[ncon,'conselho'],[nrec,'REC final'],[nsem,'sem nota']]
  :[[at.length,'alunos na sala'],[FM(avgOf(medias)),'média acumulada'],[risco,'em risco'],[criticos,'críticos'],[quedas,'com queda ≥ 1,0'],[nsem,'sem nota']]);
 // Pauta do Conselho: quem não chegou a 24 pontos nos 4 bimestres (média < 6) e pode receber pontos na reunião.
 const pauta=at.filter(r=>r.media!=null&&(r.n===4?r.soma<24:r.media<MEDIA_MIN)).sort(ordemConselho);
 const somaTag=r=>`${fmt(r.soma)}${r.n<4?`<small>${r.n}/4</small>`:''}`;
 h+=`<div class="cn-prio"><h3>🎯 Pauta do Conselho · ${pauta.length} aluno(s)</h3><p class="cn-hint">${ate==4?'Alunos com <b>soma dos 4 bimestres abaixo de 24 pontos</b> (média geral &lt; 6).':'Alunos com <b>média abaixo de 6 até o '+ate+'º bimestre</b> (ainda não garantiram passagem direta).'} São os casos a discutir com os outros professores: na reunião, pode ser dado 1 ponto ou mais para não precisar de REC final e passar direto. Ordem: por turma e, dentro da turma, pela ordem da listagem (nº da chamada). Quem ainda não tem os 4 bimestres aparece com a soma parcial marcada.</p>`;
 h+=pauta.length?`<div class="scroll"><table class="stk"><thead><tr><th>Turma</th><th style="text-align:left">Aluno</th>`+BIMS.map(b=>`<th>${b}º</th>`).join('')+`<th>Soma</th><th>Média</th><th>Falta p/ 6</th><th>Pontos p/ 24</th><th>Situação</th></tr></thead><tbody>`+pauta.map(r=>`<tr class="go" data-fi="${r.s.id}" data-t="${r.t}"><td><b>${r.t}</b></td><td style="text-align:left">${esc(r.s.n)}</td>`+r.bms.map(v=>`<td class="${bc(v)}">${FM(v)}</td>`).join('')+`<td>${somaTag(r)}</td><td class="${bc(r.media)}"><b>${FM(r.media)}</b></td><td>${FM(r.falta)}</td><td>${r.n===4?fmt(Math.max(0,24-r.soma)):'–'}</td><td class="${({'Aprovado':'bo','Conselho':'bm','REC final':'bd'})[r.sit]||''}">${r.sit}</td></tr>`).join('')+'</tbody></table></div>':'<p class="mi">Nenhum aluno nesta pauta.</p>';
 h+='</div>';
 h+=`<h3>${alvo}</h3><div class="lanc"><label style="text-align:left">Turma: <select id="cnTurma"><option value="*" ${S.ct=='*'?'selected':''}>Todas as turmas</option>${db.turmas.map(t=>`<option value="${t}" ${S.ct==t?'selected':''}>${t}</option>`).join('')}</select></label><span class="mi">Ao entrar, mostra a 1A (menor turma); escolha <b>Todas as turmas</b> se precisar ver todas. A pauta acima sempre mostra todas. Toque no nome para abrir a ficha.</span></div>`;
 const lista=at.filter(r=>S.ct=='*'||r.t==S.ct).sort(ordemConselho);
 const sitCls=s=>({'Aprovado':'bo','Conselho':'bm','REC final':'bd'})[s]||'';
 const ajuste=r=>r.media==null||r.media>=6||r.alvo4==null?'–':(!r.atinge4?'<b style="color:var(--bad)">não alcança com 10</b>':(r.bms[3]==null?`tirar ${fmt(r.alvo4)}`:`4º ${fmt(r.bms[3])} → ${fmt(r.alvo4)} (+${fmt(r.alvo4-r.bms[3])})`));
 const motivos=r=>{const a=[];if(r.media!=null&&r.media<MEDIA_MIN)a.push(`<span class="cn-tag r">faltam ${fmt(r.falta)}</span>`);if(r.queda!=null&&r.queda<=-1)a.push(`<span class="cn-tag y">queda ${fmt(r.queda)} no ${r.quedaBim}º</span>`);if(r.critico)a.push('<span class="cn-tag r">crítico</span>');if(r.fraco)a.push(`<span class="cn-tag">${esc(r.fraco)}</span>`);return a.join('')||'<span class="mi">–</span>'};
 h+=`<div class="scroll"><table class="stk"><thead><tr><th>Nº</th><th style="text-align:left">Aluno</th>`+BIMS.map(b=>`<th>${b}º bim</th>`).join('')+`<th>${alvo}</th><th>Situação</th><th>Falta p/ 6</th><th>${adj}</th><th style="text-align:left">Ponto fraco / risco</th></tr></thead><tbody>`;
 lista.forEach(r=>{h+=`<tr class="go" data-fi="${r.s.id}" data-t="${r.t}"><td>${r.i}</td><td style="text-align:left"><b>${esc(r.s.n)}</b><small>${r.t}</small></td>`+r.bms.map(v=>`<td class="${bc(v)}">${FM(v)}</td>`).join('')+`<td class="${bc(r.media)}"><b>${FM(r.media)}</b>${r.n<ate?`<small>${r.n}/${ate}</small>`:''}</td><td class="${sitCls(r.sit)}">${r.sit}</td><td>${FM(r.falta)}</td><td>${ajuste(r)}</td><td style="text-align:left">${motivos(r)}</td></tr>`});
 h+='</tbody></table></div>';
 const alvoLista=at.filter(modo=='f'?r=>r.sit=='REC final':r=>r.risco).sort(ordemConselho);
 const sec=(tt,l)=>`<h3>${tt} (${l.length})</h3>`+(l.length?`<div class="scroll"><table class="stk"><thead><tr><th>Turma</th><th style="text-align:left">Aluno</th><th>Média</th><th>Falta</th><th>${adj}</th><th style="text-align:left">Motivo</th></tr></thead><tbody>`+l.map(r=>`<tr class="go" data-fi="${r.s.id}" data-t="${r.t}"><td><b>${r.t}</b></td><td style="text-align:left">${esc(r.s.n)}</td><td class="${bc(r.media)}">${FM(r.media)}</td><td>${FM(r.falta)}</td><td>${ajuste(r)}</td><td style="text-align:left">${motivos(r)}</td></tr>`).join('')+'</tbody></table></div>':'<p class="mi">Nenhum aluno.</p>');
 h+='<hr class="sepc">'+sec('Fundamental I · '+(modo=='f'?'REC final':'resgate'),alvoLista.filter(r=>f1(r.t)))+'<hr class="sepc">'+sec('Fundamental II · '+(modo=='f'?'REC final':'resgate'),alvoLista.filter(r=>!f1(r.t)));
 h+='<p class="cn-hint">Ordem: por turma e, dentro da turma, pela ordem da listagem (nº da chamada). A justificativa mostra o bimestre em que o componente ficou mais fraco (P1, atividades, presença, ENG/TRAB).</p>';
 if(off.length){h+=`<details class="cn-hist"><summary>Histórico · ${off.length} aluno(s) que saíram da turma (fora das listas)</summary><div class="scroll"><table><thead><tr><th>Turma</th><th style="text-align:left">Aluno</th>`+BIMS.map(b=>`<th>${b}º</th>`).join('')+`<th>Média</th><th>Situação</th><th style="text-align:left">Obs</th></tr></thead><tbody>`+off.sort(ordemConselho).map(r=>`<tr><td>${r.t}</td><td style="text-align:left">${esc(r.s.n)}</td>`+r.bms.map(v=>`<td>${FM(v)}</td>`).join('')+`<td>${FM(r.media)}</td><td>${r.sit}</td><td style="text-align:left">${esc(r.obs)}</td></tr>`).join('')+'</tbody></table></div></details>'}
 // Gráficos ficam no fim: ao abrir, aparece primeiro a pauta e a lista de alunos.
 const taxa=a=>Math.round(a.filter(modo=='f'?r=>r.sit=='REC final':r=>r.risco).length/Math.max(1,a.length)*100);
 const linha=(l,a)=>[l,taxa(a),col(taxa(a)/100),a.filter(modo=='f'?r=>r.sit=='REC final':r=>r.risco).length+'/'+a.length];
 const cn=FX.map(f=>medias.filter(m=>m>=f[1]&&m<f[2]).length);
 h+='<hr class="sepc"><h3>📊 Gráficos · visão geral</h3><p class="cn-hint">Os gráficos consideram todas as turmas, mesmo quando você filtra a tabela acima.</p>';
 h+='<h3>'+(modo=='f'?'REC final':'Alunos em risco')+' por turma</h3>'+bars(db.turmas.map(t=>linha(t,at.filter(r=>r.t==t))),100);
 h+='<h3>'+(modo=='f'?'REC final':'Alunos em risco')+' por ano</h3>'+bars([...new Set(db.turmas.map(t=>t[0]))].map(y=>linha(y+'º ano',at.filter(r=>r.t[0]==y))),100);
 h+='<h3>Distribuição das médias</h3>'+bars(FX.map((f,i)=>[f[0],cn[i],i<2?'var(--bad)':i==2?'#e0a800':'var(--ok)',cn[i]+' aluno(s)']),Math.max(1,...cn));
 return h}
function conselhoXlsx(){
 const ate=S.cm=='f'?4:+S.bim,rows=conselhoRows(ate).filter(r=>!r.off),fx=faixaConselho(),R=v=>v==null?'':Math.round(v*100)/100;
 const just=r=>[r.queda!=null&&r.queda<=-1?'queda '+fmt(r.queda)+' no '+r.quedaBim+'º':'',r.critico?'crítico':'',r.fraco].filter(Boolean).join(' · ');
 const linha=r=>[r.i,r.s.n,r.sit,...r.bms.map(R),R(r.media),r.n,R(r.falta),r.alvo4==null?'':(!r.atinge4?'não alcança com 10':(r.bms[3]==null?'tirar '+fmt(r.alvo4):'4º → '+fmt(r.alvo4))),just(r),r.obs];
 exportXlsxNamed(`Conselho-${S.cm=='f'?'anual-2026':ate+'bim-2026'}.xlsx`,()=>{
  const sheets=[{name:'Resumo',rows:[['Conselho / Fechamento · 2026'],['Modo',S.cm=='f'?'Fechamento':'Acompanhamento até '+ate+'º'],['Faixa de conselho',fmt(fx)],['Alunos na sala',rows.length],['Aprovados',rows.filter(r=>r.sit=='Aprovado').length],['Conselho',rows.filter(r=>r.sit=='Conselho').length],['REC final',rows.filter(r=>r.sit=='REC final').length],['Em risco',rows.filter(r=>r.risco).length]]}];
  const pauta=rows.filter(r=>r.media!=null&&(r.n===4?r.soma<24:r.media<MEDIA_MIN)).sort(ordemConselho);
  sheets.push({name:'Pauta Conselho',rows:[['Pauta do Conselho · média < 6'+(ate==4?' (soma dos 4 bimestres < 24)':' (acumulado até '+ate+'º)')+' · ordem: turma / nº da chamada'],['Turma','Nº','Nome','1º','2º','3º','4º','Soma','Bimestres','Média','Falta p/ 6','Pontos p/ 24','Situação'],...pauta.map(r=>[r.t,r.i,r.s.n,...r.bms.map(R),R(r.soma),r.n,R(r.media),R(r.falta),r.n===4?R(Math.max(0,24-r.soma)):'',r.sit])]});
  const rec=rows.filter(r=>r.sit=='REC final').sort(ordemConselho);
  sheets.push({name:'REC final',rows:[['Turma','Nº','Nome','Média','Falta','Ajuste','Motivo'],...rec.map(r=>[r.t,r.i,r.s.n,R(r.media),R(r.falta),linha(r)[10],just(r)])]});
  const hd=['Nº','Nome','Situação','1º','2º','3º','4º','Média','Bimestres com nota','Falta p/ 6','Ajuste','Motivo','Obs'];
  db.turmas.forEach(t=>{const a=rows.filter(r=>r.t==t);if(a.length)sheets.push({name:t,rows:[hd,...a.map(linha)]})});
  return sheets});
}
