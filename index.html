<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notas · Lab. de Informática</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1c2333;--mut:#6b7385;--bd:#dfe3ec;--pri:#3b5bdb;--ok:#2f9e44;--okbg:#d3f0d9;--half:#ffe9b3;--bad:#d6336c;--media:#0b7285;--mediabg:#d0ebff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#98a0b3;--bd:#2d3240;--pri:#748ffc;--ok:#69db7c;--okbg:#1f4a2c;--half:#5a4712;--bad:#ff8fab;--media:#66d9e8;--mediabg:#12384a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#98a0b3;--bd:#2d3240;--pri:#748ffc;--ok:#69db7c;--okbg:#1f4a2c;--half:#5a4712;--bad:#ff8fab;--media:#66d9e8;--mediabg:#12384a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:18px;margin:0;flex:1;min-width:160px}
select,input,button,textarea{font:inherit;color:var(--tx)}
select,.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border:3px solid var(--bc,var(--bd));border-radius:12px;overflow:hidden}
.card h2{margin:0;padding:10px 12px;font-size:17px;background:var(--bc,var(--card));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{color:var(--mut);font-weight:400}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:4px 5px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
th.fill{cursor:pointer;color:var(--pri)}
td.nm{text-align:left;white-space:normal;min-width:150px;max-width:260px}
td.n{color:var(--mut);width:28px}
.a{width:40px;height:34px;border-radius:8px;border:1px solid var(--bd);background:transparent;cursor:pointer;font-weight:600}
.a.v2{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.a.v1{background:var(--half);border-color:#e0a800}
.in{width:58px;padding:6px;border:1px solid var(--bd);border-radius:8px;text-align:center;background:var(--card)}
.in:focus{outline:2px solid var(--pri);border-color:transparent}
.c{font-weight:600;min-width:44px}
.m{font-weight:700;background:var(--mediabg);color:var(--media);border-radius:6px;min-width:52px}
.m.low{color:var(--bad)}
.foot{display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;color:var(--mut);font-size:13px}
.foot b{color:var(--tx)}
.add{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--bd);flex-wrap:wrap}
.add input{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.rule{color:var(--mut);font-size:12px;padding:8px 12px;border-top:1px solid var(--bd)}
.x{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:560px;max-height:90%;overflow:auto}
.box textarea{width:100%;height:140px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace}
.box p{color:var(--mut);font-size:13px;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.empty{padding:24px;text-align:center;color:var(--mut)}

:root{--badbg:#ffc9c9;--badtx:#c92a2a;--yel:#fff3bf}
:root[data-theme="dark"]{--badbg:#5c1a24;--badtx:#ffa8b8;--yel:#5c4a0a}
td.red{background:var(--badbg)!important;color:var(--badtx);font-weight:700}
td.red .in{background:transparent;color:var(--badtx);border-color:var(--badtx);font-weight:700}
tr.off td{background:var(--yel)}
tr.off td.nm{font-weight:600}
.tag{font-size:11px;background:#f59f00;color:#000;border-radius:6px;padding:1px 6px;margin-left:6px}

:root{--orgbg:#ffa94d;--orgtx:#4a2300}
:root[data-theme="dark"]{--orgbg:#9c5410;--orgtx:#ffe0bf}
:root{--b1:#a9c4e8;--b2:#b3d6b9;--b3:#c5bbe6;--b4:#e6b8d4;--bct:#1c2333}
:root[data-theme="dark"]{--b1:#3a5578;--b2:#3d6648;--b3:#584d86;--b4:#7f4a6b;--bct:#e8eaf0}
[data-bim="1"]{--bc:var(--b1)}[data-bim="2"]{--bc:var(--b2)}[data-bim="3"]{--bc:var(--b3)}[data-bim="4"]{--bc:var(--b4)}
body{border-top:8px solid var(--bc)}
.bims{display:flex;gap:6px}
.bb{border:2px solid var(--c);color:var(--tx);background:transparent;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.bb[data-b="1"]{--c:var(--b1)}.bb[data-b="2"]{--c:var(--b2)}.bb[data-b="3"]{--c:var(--b3)}.bb[data-b="4"]{--c:var(--b4)}
.bb.on{background:var(--c);color:var(--bct)}
.chip.on{background:var(--bc);border-color:var(--bc);color:var(--bct)}
.card h2{color:var(--bct)}
.card h2 .btn{color:var(--tx)}
.locked .a,.locked th.fill,.locked .lb,.locked input.p,.locked #rl{pointer-events:none}
.locked th.fill{color:var(--mut)}
.locked input.p{background:transparent;border-color:transparent}
.lock{font-weight:700}
.lock.open{background:var(--half);border-color:#e0a800}
.sched{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px}
.sched b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sched .sl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:16px;font-weight:600}
.sched .hj{font-size:11px;background:var(--bc);color:var(--bct);border-radius:6px;padding:1px 7px}
td.org{background:var(--orgbg)!important;color:var(--orgtx);font-weight:700}
td.org .in{background:transparent;color:var(--orgtx);border-color:var(--orgtx)}
td.elig .in{border:2px dashed #e67700;background:var(--half)}
td.used .in{border:2px solid var(--ok)}
.lanc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--bd);font-size:13px}
.lb{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600}
.lb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.obs{font-size:12px;color:var(--mut);font-weight:400}
sup{font-size:9px;margin-left:2px}

.warn{background:var(--half);border-bottom:1px solid #e0a800;padding:8px 12px;font-size:13px}
.wm{color:#e67700;margin-left:2px}
tr.go{cursor:pointer}tr.go:hover td{background:var(--bg)}
#pr{display:none}
@media print{
@page{size:A4 portrait;margin:12mm}
body>*:not(#pr){display:none!important}
body{border:0;background:#fff}
#pr{display:block;color:#000;font:12px/1.3 system-ui,sans-serif}
#pr h2{font-size:15px;margin:0 0 8px}
#pr table{width:100%;border-collapse:collapse;min-width:0}
#pr th,#pr td{border:1px solid #888;padding:3px 5px;text-align:center;color:#000;background:none;position:static}
#pr td:nth-child(2){text-align:left}
#pr tr.off td{background:#fff3bf;font-style:italic;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr td.rd{color:#c92a2a;font-weight:700}
#pr p{margin:8px 0}
}

#cl{width:150px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding-left:6px;padding-right:6px}
td.m.p3m{outline:3px solid #f5c400;outline-offset:-3px}
.lb3.on{background:var(--half);border-color:#e0a800}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>📚 Notas · Lab. de Informática</h1>
<div class="bims" id="bims"><button class="bb" data-b="1">1º Bim</button><button class="bb" data-b="2">2º Bim</button><button class="bb" data-b="3">3º Bim</button><button class="bb" data-b="4">4º Bim</button></div>
<button class="btn" id="pn">📋 Painel</button><button class="btn" id="th" title="Tema claro/escuro">🌙</button><button class="btn" id="cl" style="display:none" title="Sincronizar"></button><button class="btn" id="bk">Backup / Exportar</button>
</header>
<div class="chips" id="chips"></div>
<div class="card" id="card"></div>
<div class="sched" id="sched"></div>
</div>
<div class="ov" id="ov"><div class="box">
<b>Backup e exportação</b>
<p>Seus dados ficam salvos neste navegador. Copie o backup de vez em quando e guarde em um lugar seguro (e-mail, bloco de notas).</p>
<div class="row"><button class="btn pri" id="b1">Gerar backup completo</button><button class="btn" id="b2">Notas da turma (colar na planilha)</button></div>
<textarea id="ta" placeholder="O texto aparece aqui. Para restaurar, cole um backup e toque em Restaurar."></textarea>
<div class="row"><button class="btn" id="b3">Copiar texto</button><button class="btn" id="b4">Restaurar backup colado</button><button class="btn" id="b6">Baixar arquivo .json</button><label class="btn">Restaurar de arquivo<input type="file" id="fi" accept=".json" hidden></label><button class="btn" id="b5">Fechar</button></div>
<p id="msg"></p>
</div></div>
<div id="pr"></div>
<div class="ov" id="lg"><div class="box"><b>Entrar</b><p>Acesso restrito ao professor.</p>
<div class="row"><input class="in" style="width:100%;text-align:left" id="em" type="email" placeholder="E-mail" autocomplete="username"></div>
<div class="row"><input class="in" style="width:100%;text-align:left" id="pw" type="password" placeholder="Senha" autocomplete="current-password"></div>
<div class="row"><button class="btn pri" id="go">Entrar</button></div><p id="lm"></p></div></div>
<script>
const DATA={"turmas":["1A","1D","2A","2D","3A","3D","4A","4D","5A","5D","6A","6B","6D","7A","7B","7D","8A","8B","8D","9A","9B","9D"],"roster":{"1A":[],"1D":[],"2A":[],"2D":[],"3A":[],"3D":[],"4A":[],"4D":[],"5A":[],"5D":[],"6A":[],"6B":[],"6D":[],"7A":[],"7B":[],"7D":[],"8A":[],"8B":[],"8D":[],"9A":[],"9B":[],"9D":[]},"grades":{}};
const KEY='notas-lab-info-v1';
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.roster)db=DATA;
const S={bim:'4',t:db.turmas[0],edit:false};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}push()}
const fmt=v=>v==null?'':(Math.round(v*10)/10).toFixed(1).replace('.',',');
const f1=t=>+t[0]<=5;
const CUR='4',MEDIA_MIN=6,PROVA_MIN=3.5,P3_MAX=4;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const L=(b,t)=>{db.launch=db.launch||{};db.launch[b]=db.launch[b]||{};return db.launch[b][t]=db.launch[b][t]||{}};
const G=(b,t)=>((db.grades[b]=db.grades[b]||{})[t]=db.grades[b][t]||{});
function calc(t,g){g=g||{};const a=g.a||[];const vs=a.filter(v=>v!=null);const cnt=vs.length,sum=vs.reduce((s,v)=>s+v,0);let p1,p2,e,p3=null;
 if(f1(t)){p1=g.p1==null?null:g.p1;p3=g.p3==null?null:g.p3;p2=sum;e=cnt/2}else{p1=sum;p2=cnt*2;e=g.e==null?null:g.e}
 const any=cnt>0||g.p1!=null||g.e!=null||p3!=null;
 let pu=p1,u3=false;if(p3!=null&&(p1==null||p3>p1)){pu=p3;u3=true}
 return{p1,p2,e,p3,cnt,u3,m:any?((pu||0)+p2)/2+(e||0):null,any}}
function num(s){s=String(s).trim().replace(',','.');if(s==='')return null;const v=parseFloat(s);return isNaN(v)?null:Math.min(10,Math.max(0,v))}
function turmaTitle(t){return t[0]+'º ano '+t.slice(1)}
function chips(){$('chips').innerHTML=db.turmas.map(t=>{const l=(((db.launch||{})[S.bim]||{})[t])||{},n=(l.p1?1:0)+(l.p2?1:0)+(l.t?1:0);return `<button class="chip ${t===S.t?'on':''}" data-t="${t}" title="Lançado na escola: ${n}/3">${t}${n==3?' ✓':n?' ◐':''}${Object.keys(l.dirty||{}).length?' ⚠':''}</button>`}).join('');
 $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.t=b.dataset.t;S.edit=false;S.unlock=false;S.view=null;chips();render()})}
const SCH={'2A':['Segunda',['07:00–07:50']],'3A':['Segunda',['11:00–11:50']],'5D':['Segunda',['12:40–13:30']],
'8A':['Terça',['07:00–08:40']],'8B':['Terça',['08:40–09:30','09:50–10:40']],'9B':['Terça',['10:40–12:20']],'2D':['Terça',['12:40–13:30']],'8D':['Terça',['15:10–16:00']],'9D':['Terça',['17:10–18:00']],
'5A':['Quarta',['10:10–11:00']],'1A':['Quarta',['11:00–11:50']],'1D':['Quarta',['12:40–13:30']],
'6B':['Quinta',['07:00–07:50']],'6A':['Quinta',['07:50–08:40']],'4A':['Quinta',['11:00–11:50']],'4D':['Quinta',['12:40–13:30']],
'9A':['Sexta',['07:00–08:40']],'7B':['Sexta',['09:00–09:50']],'7A':['Sexta',['11:30–12:20']],'3D':['Sexta',['12:40–13:30']],'6D':['Sexta',['16:20–17:10']],'7D':['Sexta',['17:10–18:00']]};
const DN={'Segunda':1,'Terça':2,'Quarta':3,'Quinta':4,'Sexta':5};
function sched(){const el=$('sched');if(!el)return;const s=SCH[S.t];if(S.view||!s){el.style.display='none';return}
 const turno=+s[1][0].slice(0,2)<12?'Matutino':'Vespertino',hoje=new Date().getDay()==DN[s[0]];
 el.style.display='';el.innerHTML='<b>Dia e horário da aula · '+turmaTitle(S.t)+'</b><div class="sl"><span>'+s[0]+'-feira · '+s[1].join(' e ')+'</span><span style="color:var(--mut);font-weight:400;font-size:13px">'+turno+'</span>'+(hoje?'<span class="hj">hoje</span>':'')+'</div>'}
function render(){
 sched();
 if(S.view){painel();return}
 const t=S.t,ros=db.roster[t]||[],gr=G(S.bim,t),fund=f1(t);
 const LL=L(S.bim,t);
 let h=`<h2><span>${S.bim}º BIMESTRE / 2026 · ${turmaTitle(t)}</span><span><button class="btn lock ${S.unlock?'open':''}" id="lk">${S.unlock?'✏️ Editando · travar':'🔒 Liberar edição'}</button> <button class="btn" id="rp">🖨 Relatório</button> ${fund?`<button class="btn lb3 ${S.p3?'on':''}" id="p3v" title="Mostrar/ocultar coluna P3">👁 P3</button> <button class="btn" id="p3b">🖨 Lista P3</button> `:''}${S.unlock?`<button class="btn" id="ed">${S.edit?'Concluir edição':'Editar lista'}</button>`:''}</span></h2><div class="lanc"><b>Lançado no sistema da escola:</b>${[['p1','P1'],['p2','P2'],['t','Eng/T']].map(([k,n])=>`<button class="lb ${LL[k]?'on':''}" data-l="${k}">${LL[k]?'☑':'☐'} ${n}</button>`).join('')}</div><div id="warn"></div>`;
 h+=`<div class="scroll"><table><thead><tr><th>Nº</th><th style="text-align:left">Nome</th>`+[0,1,2,3].map(i=>`<th class="fill" data-f="${i}" title="Marcar todos que estão em branco como entregue">Ativ ${i+1}</th>`).join('')+`<th>P1</th><th>P2</th><th>Eng/T</th>${fund&&S.p3?'<th title="Recuperação da P1">P3</th>':''}<th>Média</th></tr></thead><tbody>`;
 if(!ros.length)h+=`<tr><td colspan="10" class="empty">Nenhum aluno nesta turma.</td></tr>`;
 ros.forEach((s,i)=>{const g=gr[s.id]||{};
  h+=`<tr data-id="${s.id}" class="${s.off?'off':''}"><td class="n">${i+1}</td><td class="nm">${S.edit?`<input class="in" style="width:80%;text-align:left" data-rn="${s.id}" value="${s.n.replace(/"/g,'&quot;')}"> <button class="x" data-del="${s.id}" title="Remover aluno">✕</button><br><label style="font-size:12px"><input type="checkbox" data-off="${s.id}" ${s.off?'checked':''}> Saiu da turma</label><br><input class="in" style="width:95%;text-align:left;margin-top:4px" data-obs="${s.id}" placeholder="Observação" value="${esc(s.obs||'')}">`:s.n+(s.off?'<span class="tag">saiu</span>':'')+(s.obs?'<div class="obs">'+esc(s.obs)+'</div>':'')}</td>`;
  for(let k=0;k<4;k++){const v=(g.a||[])[k];h+=`<td><button class="a ${v==2?'v2':v==1?'v1':''}" data-k="${k}">${v==null?'·':fmt(v)}</button></td>`}
  h+=fund?`<td><input class="in p" data-f="p1" inputmode="decimal" value="${fmt(g.p1)}" placeholder="0–8"></td><td class="c" data-c="p2"></td><td class="c" data-c="e"></td>${S.p3?`<td><input class="in p" data-f="p3" inputmode="decimal" value="${fmt(g.p3)}" placeholder="P3"></td>`:''}`
        :`<td class="c" data-c="p1"></td><td class="c" data-c="p2"></td><td><input class="in p" data-f="e" inputmode="decimal" value="${fmt(g.e)}" placeholder="0–2"></td>`;
  h+=`<td class="c m" data-c="m"></td></tr>`});
 h+=`</tbody></table></div><div class="foot" id="foot"></div>`;
 if(S.edit)h+=`<div class="add"><input id="newn" placeholder="Nome do novo aluno"><button class="btn pri" id="addb">Adicionar aluno</button></div>`;
 h+=`<div class="rule">${fund?'Fundamental I: P1 digitada · P2 = soma das atividades · Eng/T = 0,5 por atividade entregue · Média = (P1 + P2) ÷ 2 + Eng/T.':'Fundamental II: P1 = soma das atividades · P2 = 2 por atividade entregue · Eng/T digitada · Média = (P1 + P2) ÷ 2 + Eng/T.'} Toque na atividade: 2 → 1 → em branco.</div>`;
 $('card').innerHTML=h;$('card').classList.toggle('locked',!S.unlock);
 ros.forEach(s=>upd(s.id));foot();warn();
 const card=$('card');
 card.querySelectorAll('.a').forEach(b=>b.onclick=()=>{const id=b.closest('tr').dataset.id,k=+b.dataset.k,g=(gr[id]=gr[id]||{a:[null,null,null,null]});g.a=g.a||[null,null,null,null];
  const c=g.a[k];g.a[k]=c==null?2:c==2?1:null;b.className='a '+(g.a[k]==2?'v2':g.a[k]==1?'v1':'');b.textContent=g.a[k]==null?'·':fmt(g.a[k]);touch(id,'a');save();upd(id);foot()});
 card.querySelectorAll('th.fill').forEach(th=>th.onclick=()=>{const k=+th.dataset.f;ros.forEach(s=>{const g=(gr[s.id]=gr[s.id]||{a:[null,null,null,null]});g.a=g.a||[null,null,null,null];if(g.a[k]==null){g.a[k]=2;touch(s.id,'a')}});save();render()});
 card.querySelectorAll('input.p').forEach(inp=>{
  inp.oninput=()=>{const id=inp.closest('tr').dataset.id,g=(gr[id]=gr[id]||{});g[inp.dataset.f]=num(inp.value);touch(id,inp.dataset.f);save();upd(id);foot()};
  inp.onblur=()=>{const v=num(inp.value);inp.value=fmt(v)};
  inp.onfocus=()=>inp.select();
  inp.onkeydown=e=>{const all=[...card.querySelectorAll('input.p[data-f="'+inp.dataset.f+'"]')],i=all.indexOf(inp);
   if(e.key=='Enter'||e.key=='ArrowDown'){e.preventDefault();(all[i+1]||inp).focus()}
   if(e.key=='ArrowUp'){e.preventDefault();(all[i-1]||inp).focus()}}});
