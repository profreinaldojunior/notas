<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:18px;margin:0;flex:1;min-width:160px}
select,input,button,textarea{font:inherit;color:var(--tx)}
select,.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border:3px solid var(--bc,var(--bd));border-radius:12px;overflow:hidden}
.card h2{margin:0;padding:10px 12px;font-size:17px;background:var(--bc,var(--card));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{color:var(--mut);font-weight:400}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:4px 5px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
th.fill{cursor:pointer;color:var(--pri)}
td.nm{text-align:left;white-space:normal;min-width:150px;max-width:260px}
td.n{color:var(--mut);width:28px}
.a{width:40px;height:34px;border-radius:8px;border:1px solid var(--bd);background:transparent;cursor:pointer;font-weight:600}
.a.v2{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.a.v1{background:var(--half);border-color:#e0a800}
.in{width:58px;padding:6px;border:1px solid var(--bd);border-radius:8px;text-align:center;background:var(--card)}
.in:focus{outline:2px solid var(--pri);border-color:transparent}
.c{font-weight:600;min-width:44px}
.m{font-weight:700;background:var(--mediabg);color:var(--media);border-radius:6px;min-width:52px}
.m.low{color:var(--bad)}
.foot{display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;color:var(--mut);font-size:13px}
.foot b{color:var(--tx)}
.add{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--bd);flex-wrap:wrap}
.add input{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.rule{color:var(--mut);font-size:12px;padding:8px 12px;border-top:1px solid var(--bd)}
.x{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:560px;max-height:90%;overflow:auto}
.box textarea{width:100%;height:140px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace}
.box p{color:var(--mut);font-size:13px;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.empty{padding:24px;text-align:center;color:var(--mut)}

:root{--badbg:#ffc9c9;--badtx:#c92a2a;--yel:#fff3bf}
:root[data-theme="dark"]{--badbg:#5c1a24;--badtx:#ffa8b8;--yel:#5c4a0a}
td.red{background:var(--badbg)!important;color:var(--badtx);font-weight:700}
td.red .in{background:transparent;color:var(--badtx);border-color:var(--badtx);font-weight:700}
tr.off td{background:var(--yel)}
tr.off td.nm{font-weight:600}
.tag{font-size:11px;background:#f59f00;color:#000;border-radius:6px;padding:1px 6px;margin-left:6px}

:root{--orgbg:#ffa94d;--orgtx:#4a2300}
:root[data-theme="dark"]{--orgbg:#9c5410;--orgtx:#ffe0bf}
:root{--b1:#a9c4e8;--b2:#b3d6b9;--b3:#c5bbe6;--b4:#e6b8d4;--bct:#1c2333}
:root[data-theme="dark"]{--b1:#3a5578;--b2:#3d6648;--b3:#584d86;--b4:#7f4a6b;--bct:#e8eaf0}
[data-bim="1"]{--bc:var(--b1)}[data-bim="2"]{--bc:var(--b2)}[data-bim="3"]{--bc:var(--b3)}[data-bim="4"]{--bc:var(--b4)}
body{border-top:8px solid var(--bc)}
.bims{display:flex;gap:6px}
.bb{border:2px solid var(--c);color:var(--tx);background:transparent;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.bb[data-b="1"]{--c:var(--b1)}.bb[data-b="2"]{--c:var(--b2)}.bb[data-b="3"]{--c:var(--b3)}.bb[data-b="4"]{--c:var(--b4)}
.bb.on{background:var(--c);color:var(--bct)}
.chip.on{background:var(--bc);border-color:var(--bc);color:var(--bct)}
.card h2{color:var(--bct)}
.card h2 .btn{color:var(--tx)}
.locked .a,.locked th.fill,.locked .lb,.locked input.p,.locked #rl{pointer-events:none}
.locked th.fill{color:var(--mut)}
.locked input.p{background:transparent;border-color:transparent}
.lock{font-weight:700}
.lock.open{background:var(--half);border-color:#e0a800}
.sched{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px}
.sched b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sched .sl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:16px;font-weight:600}
.sched .hj{font-size:11px;background:var(--bc);color:var(--bct);border-radius:6px;padding:1px 7px}
td.org{background:var(--orgbg)!important;color:var(--orgtx);font-weight:700}
td.org .in{background:transparent;color:var(--orgtx);border-color:var(--orgtx)}
td.elig .in{border:2px dashed #e67700;background:var(--half)}
td.used .in{border:2px solid var(--ok)}
.lanc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--bd);font-size:13px}
.lb{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600}
.lb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.obs{font-size:12px;color:var(--mut);font-weight:400}
sup{font-size:9px;margin-left:2px}

.warn{background:var(--half);border-bottom:1px solid #e0a800;padding:8px 12px;font-size:13px}
.wm{color:#e67700;margin-left:2px}
tr.go{cursor:pointer}tr.go:hover td{background:var(--bg)}
#pr{display:none}
@media print{
@page{size:A4 portrait;margin:12mm}
body>*:not(#pr){display:none!important}
body{border:0;background:#fff}
#pr{display:block;color:#000;font:12px/1.3 system-ui,sans-serif}
#pr h2{font-size:15px;margin:0 0 8px}

#pr th,#pr td{border:1px solid #888;padding:3px 5px;text-align:center;color:#000;background:none;position:static}

.tb.on{background:var(--bc);border-color:var(--bc);color:var(--bct)}
.rvw{padding:12px}.rvw h3{margin:16px 0 6px;font-size:15px}.rvw table{min-width:0}

.br{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.br em{width:40px;font-style:normal;font-weight:600}
.br .tk{flex:1;background:var(--bg);border-radius:5px;height:16px;overflow:hidden}
.br .tk i{display:block;height:100%;border-radius:5px}
.br u{width:96px;text-decoration:none;text-align:right;white-space:nowrap}
.bd{background:var(--badbg);color:var(--badtx);font-weight:700}.bm{background:var(--half)}.bo{background:var(--okbg);color:var(--ok);font-weight:700}

   return `<tr class="${s.off?'off':''}"><td>${i+1}</td><td>${esc(s.n)}${s.off?' (saiu)':''}</td>`+[0,1,2,3].map(k=>`<td>${a[k]==null?'–':fmt(a[k])}</td>`).join('')+`<td class="${fund?(r.p1!=null&&r.p1<=PROVA_MIN?'rd':''):rd(r.p1)}">${fmt(r.p1)}</td>`+`<td class="${rd(r.p2)}">${fmt(r.p2)}</td><td>${fmt(r.e)}</td>`+(fund?`<td>${fmt(r.p3)}</td>`:'')+`<td class="${r.any&&r.m<MEDIA_MIN?'rd':''}${r.u3?' p3m':''}"><b>${r.any?fmt(r.m):''}</b></td><td>${esc(s.obs||'')}</td></tr>`}).join('')}
 const ms=act.map(s=>calc(t,gr[s.id]).m).filter(m=>m!=null),av=ms.length?ms.reduce((a,c)=>a+c,0)/ms.length:null;
 const sm=kind?`<p>Alunos listados: <b>${rows?act.filter(s=>{const g=gr[s.id]||{};return g.p1==null||g.p1<=P3_MAX}).length:0}</b> · Emitido em ${new Date().toLocaleDateString('pt-BR')}</p>`:`<p>Alunos na sala: <b>${act.length}</b> · Média da turma: <b>${fmt(av)||'–'}</b> · Abaixo de 6: <b>${ms.filter(m=>m<MEDIA_MIN).length}</b> · Lançado na escola: P1 ${l.p1?'✓':'☐'} P2 ${l.p2?'✓':'☐'} Eng/T ${l.t?'✓':'☐'} · Emitido em ${new Date().toLocaleDateString('pt-BR')}</p>`;
 $('pr').innerHTML=hd+'<table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table>'+sm;window.print()}
function foot(){const all=db.roster[S.t]||[],ros=all.filter(s=>!s.off),gr=G(S.bim,S.t);const ms=ros.map(s=>calc(S.t,gr[s.id]).m).filter(m=>m!=null);
 const avg=ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:null;
 $('foot').innerHTML=`<span>Na sala: <b>${ros.length}</b></span><span>Saíram: <b>${all.length-ros.length}</b></span><span>Com nota: <b>${ms.length}</b></span><span>Média da turma: <b>${fmt(avg)||'–'}</b></span><span>Abaixo de 6: <b>${ms.filter(m=>m<MEDIA_MIN).length}</b></span><span>Sem nenhuma nota: <b>${ros.length-ms.length}</b></span>${f1(S.t)?`<span>Podem fazer P3: <b>${ros.filter(s=>{const g=gr[s.id]||{};return g.p3==null&&(g.p1==null||g.p1<=P3_MAX)}).length}</b></span>`:''}`}
function setBim(b){S.bim=b;document.documentElement.dataset.bim=b;document.querySelectorAll('.bb').forEach(x=>x.classList.toggle('on',x.dataset.b==b))}
document.querySelectorAll('.bb').forEach(x=>x.onclick=()=>{setBim(x.dataset.b);S.edit=false;S.unlock=false;chips();render()});
setBim(CUR);
function say(m){$('msg').textContent=m}
$('bk').onclick=()=>{$('ov').classList.add('on');say('')};
$('b5').onclick=()=>$('ov').classList.remove('on');
$('b1').onclick=()=>{$('ta').value=JSON.stringify(db);say('Backup gerado. Toque em “Copiar texto” e guarde.')};
$('b2').onclick=()=>{const t=S.t,gr=G(S.bim,t);const L=['Nº\tNome\tAtiv1\tAtiv2\tAtiv3\tAtiv4\tP1\tP2\tEng/T\tP3\tMédia\tObs'];
 (db.roster[t]||[]).forEach((s,i)=>{const g=gr[s.id]||{},r=calc(t,g);L.push([i+1,s.n,...[0,1,2,3].map(k=>fmt((g.a||[])[k])),fmt(r.p1),fmt(r.p2),fmt(r.e),fmt(r.p3),r.any?fmt(r.m):'',[s.off?'Saiu da turma':'',s.obs||'',f1(t)&&g.p1==null?'P1 não feita':''].filter(Boolean).join('; ')].join('\t'))});
 $('ta').value=L.join('\n');say('Notas de '+turmaTitle(t)+' · '+S.bim+'º bimestre.')};
$('b3').onclick=()=>{const ta=$('ta');ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}say(ok?'Copiado!':'Selecione o texto e copie manualmente.')};

function theme(x){document.documentElement.dataset.theme=x;$('th').textContent=x=='dark'?'☀️':'🌙';try{localStorage.setItem('notas-theme',x)}catch(e){}}
let th=null;try{th=localStorage.getItem('notas-theme')}catch(e){}
theme(th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('pn').onclick=()=>{S.view=S.view=='p'?null:'p';S.edit=false;chips();render()};
$('hm').onclick=()=>{S.view='h';S.edit=false;chips();render()};
$('rt').onclick=()=>{S.view=S.view=='r'?null:'r';S.edit=false;chips();render()};
$('th').onclick=()=>theme(document.documentElement.dataset.theme=='dark'?'light':'dark');
function load(d){if(!d.roster||!d.grades||!d.turmas)throw 0;db=d;save();if(!db.turmas.includes(S.t))S.t=db.turmas[0];chips();render()}
$('b4').onclick=()=>{try{load(JSON.parse($('ta').value));say('Backup restaurado.')}catch(e){say('Texto inválido. Cole o backup completo.')}};
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result));say('Arquivo restaurado.')}catch(x){say('Arquivo inválido.')}};r.readAsText(f)};
$('b6').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='notas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
// ---- Nuvem (Supabase). Preencha url e key para ativar; vazio = só neste navegador ----
const CLOUD={url:'',key:''};
let sess=null,pt=null,pushing=false,polling=false,remoteTs=null;try{sess=JSON.parse(localStorage.getItem('notas-sess'))}catch(e){}
const on=()=>CLOUD.url&&CLOUD.key;
function st(m){const b=$('cl');b.style.display=on()?'':'none';b.textContent=m.replace('sincronizado','sinc.').replace('atualizado','atual.');b.title=m+' · toque para sincronizar'}
async function auth(body,q){const r=await fetch(CLOUD.url+'/auth/v1/token?grant_type='+q,{method:'POST',headers:{apikey:CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('auth');sess=await r.json();try{localStorage.setItem('notas-sess',JSON.stringify(sess))}catch(e){}}
async function rest(m,body){const go=()=>fetch(CLOUD.url+'/rest/v1/notas_app'+(m=='GET'||m=='TS'?'?id=eq.1&select='+(m=='TS'?'updated_at':'data,updated_at'):''),{method:m=='TS'?'GET':m,headers:{apikey:CLOUD.key,Authorization:'Bearer '+(sess&&sess.access_token),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:body&&JSON.stringify(body)});
 let r=await go();if(r.status==401&&sess&&sess.refresh_token){await auth({refresh_token:sess.refresh_token},'refresh_token');r=await go()}return r}
function push(){if(!on()||!sess)return;clearTimeout(pt);st('☁️ salvando…');pt=setTimeout(async()=>{pt=null;pushing=true;try{const ts=new Date().toISOString(),r=await rest('POST',{id:1,data:db,updated_at:ts});if(r.ok)remoteTs=ts;st(r.ok?'☁️ salvo':'⚠️ erro ao salvar')}catch(e){st('⚠️ sem conexão')}pushing=false},800)}
const hhmm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
async function poll(force){if(!on()||!sess||polling||pushing||pt||(S.unlock&&!force))return;polling=true;try{const r=await rest('TS');if(!r.ok)throw 0;const j=await r.json();
 if(j.length&&(force||!remoteTs||Date.parse(j[0].updated_at)!==Date.parse(remoteTs))){polling=false;await pull()}else st('☁️ atualizado '+hhmm())}catch(e){st('⚠️ sem conexão')}polling=false}
setInterval(poll,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
addEventListener('focus',()=>poll());addEventListener('online',()=>poll());
async function pull(){try{const r=await rest('GET');if(!r.ok)throw 0;const j=await r.json();if(j.length&&j[0].data&&j[0].data.roster){db=j[0].data;remoteTs=j[0].updated_at;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if(!db.turmas.includes(S.t))S.t=db.turmas[0];chips();render();st('☁️ sincronizado '+hhmm())}else push()}catch(e){st('⚠️ sem conexão')}}
$('go').onclick=async()=>{try{await auth({email:$('em').value.trim(),password:$('pw').value},'password');$('lg').classList.remove('on');pull()}catch(e){$('lm').textContent='E-mail ou senha incorretos.'}};
$('pw').onkeydown=e=>{if(e.key=='Enter')$('go').click()};
$('cl').onclick=()=>{if(sess)poll(true);else $('lg').classList.add('on')};
if(on()){if(sess){st('☁️ conectando…');pull()}else{st('☁️ entrar');$('lg').classList.add('on')}}
chips();render();
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
